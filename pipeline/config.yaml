# the measured quarter is not set here: MEASURED_PERIOD_END in .env (read by the pipeline and the API)
sec:
  max_requests_per_second: 5       # SEC allows 10, stay well under
  backoff_seconds: [1, 2, 4, 8]    # user agent comes from env SEC_USER_AGENT
currency:
  principal_currency_required: USD   # fair_value_pct_par is NULL unless the principal unit is this
normalization:
  legal_form_tokens: [llc, inc, corp, corporation, co, company, lp, llp, ltd, limited, plc]
  structural_tokens: [holdings, holding, holdco, topco, parent, intermediate]
  instrument_keywords:             # checked in this order, first hit wins
    revolver: [revolv]
    delayed_draw: [delayed, ddtl]
    second_lien: [second lien, 2nd lien]
    first_lien: [first lien, 1st lien, senior secured, unitranche]
    unsecured: [unsecured, subordinated, mezzanine]
  # The last three entries were added on Day 5 (follow-up) for ORCIC type labels that name an ownership interest.
  equity_keywords: [common stock, preferred, warrant, units, membership interest, partnership interest, equity,
                    lp interest, llc interest, class a interest]
  # Filers whose raw name still carries an industry prefix or a repeated leading phrase. ADS used to be listed
  # here; its adapter now stores the printed legal name, so no filer needs either rule at present.
  strip_industry_prefix_filers: []
  # a parenthetical clause that starts with one of these words is removed from borrower_normalized (raw name unchanged)
  alias_clause_starts: ["dba", "d/b/a", "f/k/a", "fka", "formerly known as", "doing business as"]
  collapse_repeated_prefix_filers: []
  # Only these reference rate codes are mapped. Any other code is stored as printed and reported.
  reference_rate_codes: {E: EURIBOR, SF: SOFR, S: SOFR}
  # first match wins, one reason per row
  excluded_reason_order: [EQUITY_POSITION, ZERO_OR_NULL_PRINCIPAL, UNFUNDED_COMMITMENT, NON_USD_PRINCIPAL, NULL_FAIR_VALUE]
blocking:
  maturity_window_months: 3
  spread_window_bps: 50
  name_prefix_chars: 4
  max_block_size_warn: 200
scoring:
  scorer: token_sort_ratio         # name only, attributes gate candidacy in blocking
bands:
  auto_min: 0.92
  review_min: 0.80                 # inclusive, same number as the fuzzy floor
  just_below_min: 0.65
divergence:
  mild_pts: 1.0
  flagged_pts: 2.0
sampling:                          # not part of the matcher hash; no label moves a threshold (SPEC 12.6)
  tuning_size: 40                  # diagnostic tuning pairs, drawn at random from all measured-period candidate pairs
  heldout_auto: 60                 # held-out AUTO band sample size, adjustable (Day 8)
  heldout_per_band: 25             # held-out, every other band: min(25, band size) (Day 8)
  seed: 1                          # fixed so draws are reproducible
evaluation:
  bootstrap_resamples: 1000
  bootstrap_seed: 1
  ci_level: 0.95
blocking_recall:
  sample_size: 30
  seed: 1
freeze:
  hashed_files: [pipeline/normalize.py, pipeline/block.py, pipeline/match.py]   # add any helper module they import
# Per-filer adapters (phase_wise.md Phase 3). Not part of the matcher hash.
# Tag names were verified on the 2026-06-30 filings (docs/day1_notes.md), not assumed.
# unfunded_pattern and non_accrual_pattern are case-insensitive substrings matched against the
# filer's own footnote text. null means the evidence shows no such footnote for that filer.
filers:
  ads:
    adapter: ads
    cik: "0001837532"
    expected_name_fragment: apollo debt solutions
    fixture_label: ads
    form_type: 10-Q
    tags:
      fair_value: us-gaap:InvestmentOwnedAtFairValue
      principal: us-gaap:InvestmentOwnedBalancePrincipalAmount
      cost: us-gaap:InvestmentOwnedAtCost
      spread: us-gaap:InvestmentBasisSpreadVariableRate
      floor: us-gaap:InvestmentInterestRateFloor
      fixed_rate: us-gaap:InvestmentInterestRate
      pik_rate: us-gaap:InvestmentInterestRatePaidInKind
      shares: us-gaap:InvestmentOwnedBalanceShares
    text_tags:
      maturity: us-gaap:InvestmentMaturityDate
      reference_rate: us-gaap:InvestmentVariableInterestRateTypeExtensibleEnumeration
    unfunded_pattern: null
    non_accrual_pattern: "non-accrual status"   # "Loan was on non-accrual status as of June 30, 2026." (22 rows)
    # ADS industry comes from the identifier prefix, matched against the 'Total <industry>' names printed in the
    # schedule. These two prefixes do not match any printed name. MANUAL, checked against the HTML table:
    industry_aliases:
      "Electric Equipment": "Electrical Equipment"        # IW Buyer rows: the identifier drops the 'al'; the table header is 'Electrical Equipment'
      "Heat Makes Sense": "Personal Care Products"        # KDC/ONE row: the identifier puts the company group in the industry slot; the table puts it under 'Personal Care Products'
  hps:
    adapter: hps
    cik: "0001838126"
    expected_name_fragment: hps corporate lending
    fixture_label: hps_corporate_lending
    form_type: 10-Q
    tags: &tags_us_gaap
      fair_value: us-gaap:InvestmentOwnedAtFairValue
      principal: us-gaap:InvestmentOwnedBalancePrincipalAmount
      cost: us-gaap:InvestmentOwnedAtCost
      spread: us-gaap:InvestmentBasisSpreadVariableRate
      floor: us-gaap:InvestmentInterestRateFloor
      fixed_rate: us-gaap:InvestmentInterestRate
      pik_rate: us-gaap:InvestmentInterestRatePaidInKind
      shares: us-gaap:InvestmentOwnedBalanceShares
    text_tags: &text_tags_us_gaap
      maturity: us-gaap:InvestmentMaturityDate
      reference_rate: us-gaap:InvestmentVariableInterestRateTypeExtensibleEnumeration
    html:                       # maturity and typing come from the main schedule table
      amounts_after_maturity: 3 # par, cost, fair value
      par_on_rows_without_maturity: false   # equity rows print units, not par
      relaxed_join_below_strict_share: 0.95   # 2026-03-31 tags principal as a 'shares' fact; if the strict join covers less than this share of table rows, join the rest on (cost, fair value)
    currency_ladder:            # only for a principal with no unit tag (2026-03-31 tags principal as 'shares'); see pipeline/currency.py
      rungs: [b]                # validated on 2026-06-30 HPS: (a) symbol n 12 (below 30), (b) reference code n 612 agree 612, (c) period link ADS and ORCIC 847 of 877 (96.6%, below 99%)
      reference_period: "2026-06-30"
    unfunded_pattern: "unfunded loan commitment"
    non_accrual_pattern: "non-accrual status"   # "Loan was on non-accrual status as of June 30, 2026." (13 rows)
  orcic:
    adapter: orcic
    cik: "0001812554"
    expected_name_fragment: blue owl credit income
    fixture_label: blue_owl_credit_income
    form_type: 10-Q
    tags: *tags_us_gaap
    text_tags: *text_tags_us_gaap
    html:
      amounts_after_maturity: 4 # par, units, cost, fair value
      par_on_rows_without_maturity: true
    unfunded_pattern: null      # "partially unfunded" rows sit near par (median 0.986) and stay in
    non_accrual_pattern: "non-accrual status"   # "Investment was on non-accrual status as of June 30, 2026." (4 rows)
